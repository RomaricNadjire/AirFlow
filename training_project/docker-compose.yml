services:

  postgres:
    image: postgres:16
    container_name: airflow_training_postgres

    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: airflow_training
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  nifi:
    image: apache/nifi:2.11.0 
    container_name: training_nifi

    ports:
      - "8443:8443"

    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}

    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository

      - ./data/raw:/data/raw
      - ./nifi/drivers:/opt/nifi/drivers
  kafka:
    image: apache/kafka:4.1.1
    container_name: training_kafka

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  
  namenode:
    image: apache/hadoop:3.5.0
    container_name: training_namenode
    hostname: namenode
    restart: unless-stopped
    user: root

    environment:
      HDFS_NAMENODE_USER: "root"
      HDFS_DATANODE_USER: "root"
      HDFS_SECONDARYNAMENODE_USER: "root"
      YARN_RESOURCEMANAGER_USER: "root"
      YARN_NODEMANAGER_USER: "root"
      ENSURE_NAMENODE_DIR: "/opt/hadoop/data/name"

    command:
      - bash
      - -c
      - |
        if [ ! -f /opt/hadoop/data/name/current/VERSION ]; then
          echo "Formatting NameNode..."
          hdfs namenode -format -force -nonInteractive
        fi
        exec hdfs namenode

    ports:
      - "9870:9870"
      - "8020:8020"

    volumes:
      - namenode_data:/opt/hadoop/data
      - ./hadoop-spark/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop-spark/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
  
  datanode1:
    image: apache/hadoop:3.5.0
    container_name: training_datanode1
    hostname: datanode1
    restart: unless-stopped
    user: root

    environment:
      HDFS_NAMENODE_USER: "root"
      HDFS_DATANODE_USER: "root"
      HDFS_SECONDARYNAMENODE_USER: "root"
      YARN_RESOURCEMANAGER_USER: "root"
      YARN_NODEMANAGER_USER: "root"

    command:
      - hdfs
      - datanode

    volumes:
      - datanode1_data:/opt/hadoop/data
      - ./hadoop-spark/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop-spark/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    depends_on:
      - namenode
  
  datanode2:
    image: apache/hadoop:3.5.0
    container_name: training_datanode2
    hostname: datanode2
    restart: unless-stopped
    user: root
    
    environment:
      HDFS_NAMENODE_USER: "root"
      HDFS_DATANODE_USER: "root"
      HDFS_SECONDARYNAMENODE_USER: "root"
      YARN_RESOURCEMANAGER_USER: "root"
      YARN_NODEMANAGER_USER: "root"

    command:
      - hdfs
      - datanode

    volumes:
      - datanode2_data:/opt/hadoop/data
      - ./hadoop-spark/config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop-spark/config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    depends_on:
      - namenode
  
  spark-master:
    image: apache/spark:4.2.0-python3
    container_name: training_spark_master
    hostname: spark-master
    restart: unless-stopped

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop

    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"

    volumes:
      - ./hadoop-spark/config:/opt/spark/conf/hadoop:ro
      - ./hadoop-spark/jobs:/opt/spark/jobs
      - ./hadoop-spark/data:/opt/spark/data

  spark-worker1:
    image: apache/spark:4.2.0-python3
    container_name: training_spark_worker1
    hostname: spark-worker1
    restart: unless-stopped

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1g
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop

    depends_on:
      - spark-master

    ports:
      - "8081:8081"

    volumes:
      - ./hadoop-spark/config:/opt/spark/conf/hadoop:ro
      - ./hadoop-spark/jobs:/opt/spark/jobs
      - ./hadoop-spark/data:/opt/spark/data
  
  spark-worker2:
    image: apache/spark:4.2.0-python3
    container_name: training_spark_worker2
    hostname: spark-worker2
    restart: unless-stopped

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1g
      HADOOP_CONF_DIR: /opt/spark/conf/hadoop

    depends_on:
      - spark-master

    ports:
      - "8082:8081"

    volumes:
      - ./hadoop-spark/config:/opt/spark/conf/hadoop:ro
      - ./hadoop-spark/jobs:/opt/spark/jobs
      - ./hadoop-spark/data:/opt/spark/data


volumes:
  postgres_data:
  nifi_conf:
  nifi_state:
  nifi_database:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
  namenode_data:
  datanode1_data:
  datanode2_data:
